<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>Register Form</title>
    <link
            rel="stylesheet"
            href="./styles/form-styles.css"
    >
</head>

<body>
<main>
    <form action="#">
        <div>
            <h1>Регистрация</h1>
            <h3>Уже есть аккаунт? <span><a href="#">Войти</a></span></h3>
        </div>
        <div>
            <input
                    type="text"
                    name="company"
                    id="company"
                    placeholder="Компания"
                    required
            >
        </div>
        <div>
            <input
                    type="text"
                    name="name"
                    id="name"
                    placeholder="Имя"
                    required
            >
            <input
                    type="text"
                    name="lastname"
                    id="lastname"
                    placeholder="Фамилия"
                    required
            >
        </div>
        <div>
            <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="E-mail"
                    required
            >
        </div>
        <div>
            <button type="submit">Зарегистрироваться</button>
        </div>
        <div>
            <input
                    type="checkbox"
                    name="agree"
                    id="agree"
            >
            <label for="agree">Я прочитал и принимаю</label>
            <a href="#">Условия использования</a>
        </div>

    </form>
</main>
</body>

</html>
